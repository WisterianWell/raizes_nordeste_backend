services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://raizes:raizesnordeste@db:5432/raizes_nordeste
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raizes_nordeste
      POSTGRES_USER: raizes
      POSTGRES_PASSWORD: raizesnordeste
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raizes"]
      interval: 5s
      timeout: 5s
      retries: 5
      
volumes:
  pgdata:
